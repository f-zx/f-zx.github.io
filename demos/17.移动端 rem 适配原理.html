<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端 rom 适配原理</title>
    <style>
        /* html {
            font-size: 20px;
        } */
        .box-px {
            width: 300px;
            height: 100px;
            background-color : blueviolet;
            margin-bottom: 50px;
        }
        .box-rom {
            width: 5rem;
            height: 3rem;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="box-px"></div>
    <div class="box-rom"></div>
    <script>
        //根据设备宽度计算html标签的font-size属性值
        function resetHTMLFontSize(){
            document.documentElement.style.fontSize = screen.width / 10+ 'px';
        }
        resetHTMLFontSize();

        //绑定事件
        window.onresize = resetHTMLFontSize;
    </script>
</body>
</html>
