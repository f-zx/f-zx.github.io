<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 基础语法</title>
</head>
<body>
    <script>
        //F12
        var x;//少
        let y = 5;
        const PI = 3.14;
        console.log(x,y,PI);//unfined 5 3.14
        let name = "何意味";
        console.log(name);
        let empty_value = null;
        console.log(empty_value);

        let age = 9;
        if(age > 18){
            console.log("你已经成年了");
        } else {
            console.log("未成年");   
        }

        // let time =22;
        // if(time < 12){
        //     alert("上午好");
        // }else if (time < 18){
        //     alert("下午好");
        // }else {
        //     alert("晚上好");
        // }//条件语句


        //for循环
        console.log("for");
        for(let i =1;i <= 10;i++) {
            console.log(i);
        }
        //while循环
        console.log("while");
        let index = 1;
        while(index<=10){
            console.log(index);
            index++;
        }
        //break和continue
        console.log("break&continue");
        for(let i = 0;i < 7;i++){
            if(i==2){
                continue;
            }
            if(i==5){
                break;
            }
            console.log(i);
        }
        
    </script>
</body>
</html>
